<meta charset="UTF-8">
<style id="m4-splash-style">
body.m4-booting{overflow:hidden!important}
body.m4-booting>*:not(#m4Splash){visibility:hidden!important}
#m4Splash{position:fixed;inset:0;z-index:2147483000;background:#f7ede1;color:#4c2e23;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(3vh + env(safe-area-inset-top,0px)) 18px calc(3vh + env(safe-area-inset-bottom,0px));font-family:Georgia,'Times New Roman',serif;text-align:center;opacity:1;transition:opacity .7s ease;visibility:visible!important}
#m4Splash.leave{opacity:0;pointer-events:none}
.m4s-stack{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(100%,520px)}
.m4s-ph{width:clamp(100px,26vw,140px);height:clamp(100px,26vw,140px);object-fit:cover;object-position:50% 18%;border-radius:50%;border:4px solid #fff7ef;box-shadow:0 0 0 3px #8b2233,0 13px 32px rgba(58,32,18,.15);background:#fff7ef;flex:none}
.m4s-j{animation:m4in .8s ease both}
.m4s-b{opacity:0;transform:scale(.08);transition:opacity .5s ease,transform .9s cubic-bezier(.2,.9,.3,1.15)}
.m4s-b.show{opacity:1;transform:none}
.m4s-mid{width:100%;padding:16px 16px 14px;border-radius:20px;border:1px solid #ead6c2;background:#fff7ef;box-shadow:0 8px 22px rgba(58,32,18,.1);clip-path:inset(0 50% 0 50% round 20px)}
.m4s-1{margin:0 auto;max-width:480px;font-size:clamp(20px,5.4vw,30px);font-weight:700;line-height:1.25;white-space:pre-line}
.m4s-2{margin:10px 0 0;color:#8b2233;font-size:clamp(13px,3.6vw,20px);font-weight:800;letter-spacing:.08em}
.m4s-3{margin:0;font-size:clamp(17px,4.6vw,26px);font-weight:700;font-style:italic;color:#8b2233;min-height:1.3em}
.m4s-h{visibility:hidden}
.m4s-ball{position:fixed;left:0;top:0;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#666,#0a0a0a 62%);box-shadow:0 3px 9px rgba(0,0,0,.5);z-index:3;pointer-events:none;opacity:0;will-change:transform}
.m4s-skip{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;border:1px solid #ead6c2;border-radius:999px;background:#fff7ef;color:#4c2e23;padding:7px 12px;font:700 11px system-ui,sans-serif;opacity:.7;z-index:4}
@keyframes m4in{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
/* ===== Correctifs d'affichage (en-tete et bulles), actifs des le chargement ===== */
#app #btnDemo,#app #showGuide,#app .hrow .wmb-photo,#app .hright .demo{display:none!important}
#app .hright{flex:none;gap:0}
#app .hrow{gap:6px}
#app .hrow .motto{min-width:0;overflow:hidden}
#app .hrow .motto .m1{font-size:clamp(11px,3.4vw,13px)!important}
#app .hrow .motto .m2{font-size:clamp(8px,2.5vw,10px)!important;letter-spacing:.08em!important;max-width:100%;overflow:hidden}
#bookFloat,#searchFloat{display:none!important}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>WMB Bible d’étude</title>
<style>
:root{--bg:#F6F3EE;--ink:#1A1C1E;--mut:#8A8076;--line:#E8E0D6;--blue:#1E5BFF;--navy:#0F2D7A;--orange:#FF8A3D;--c0:#0F7B3F;--c1:#1E5BFF;--c2:#B35C00;--c3:#B00020}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:Fraunces,Georgia,"Times New Roman",serif}
.shadow{box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06)}
button{font-family:inherit;cursor:pointer}
#app{max-width:920px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(246,243,238,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px}
.round{width:40px;height:40px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.badge{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--ink);color:#fff;white-space:nowrap}
.demo{height:40px;border-radius:99px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:12.5px;padding:0 14px}
.refbar{margin:0 16px 12px;background:#fff;border-radius:20px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.refbar .l{display:flex;align-items:center;gap:12px;min-width:0}
.letter{width:40px;height:40px;border-radius:50%;background:#FFF1E0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--orange);font-family:Fraunces,Georgia,serif;flex:none}
.rt{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:11px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.para-ic{width:36px;height:36px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.tabs{display:flex;gap:8px;padding:8px 16px}
.tab{flex:1;height:40px;border-radius:99px;border:0;background:#fff;color:#6B6560;font-weight:800;font-size:13px}
.tab.on{background:var(--ink);color:#fff}
main{padding:10px 16px 120px}
/* cartes versets */
.vcard{background:#fff;border-radius:22px;padding:18px 20px;margin-bottom:12px;transition:box-shadow .3s,background .3s}
.vcard.key{background:#FFF8E6;border:1px solid #FFE0B2}
.vcard.flash{box-shadow:0 0 0 3px var(--blue),0 12px 32px rgba(0,0,0,.08)}
.vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.vref{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.45}
.vcard.key .vref{opacity:1;color:#8A6A3A}
.lk{border:0;border-radius:99px;padding:6px 12px;background:var(--blue);color:#fff;font-weight:800;font-size:11.5px;white-space:nowrap}
.vcard.key .lk{background:var(--ink)}
.vt{font-family:Fraunces,Georgia,serif;font-size:18px;line-height:1.6;margin:0}
.num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;align-items:center;justify-content:center;margin-right:8px;vertical-align:3px;font-family:"Plus Jakarta Sans",sans-serif}
.vcard.key .num{background:var(--orange)}
.chips{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;border-radius:99px;padding:5px 11px;font-size:10.5px;font-weight:800;background:#EEF2FF;color:var(--navy)}
.chip.alt{background:#FFF1E0;color:#6b4a1f}
.chip.more{background:var(--bg);color:var(--ink)}
/* cartes paragraphes */
.bhead{background:var(--ink);color:#fff;border-radius:22px;padding:18px 20px;margin-bottom:12px}
.bhead .t{font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:700;line-height:1.25}
.bhead .s{font-size:12px;opacity:.6;margin-top:4px}
.bhead .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bhead button{border:0;border-radius:99px;padding:7px 12px;font-weight:800;font-size:12px;background:#fff;color:var(--ink)}
.bhead button.ghost{background:rgba(255,255,255,.12);color:#fff}
.pcard{background:#fff;border-radius:22px;padding:16px 20px;margin-bottom:12px;transition:box-shadow .3s}
.pcard.active{box-shadow:0 0 0 2px var(--blue),0 12px 32px rgba(30,91,255,.12)}
.pcard.flash{box-shadow:0 0 0 3px var(--orange),0 12px 32px rgba(0,0,0,.08)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pref{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.45}
.lkb{border:0;border-radius:99px;padding:6px 12px;background:var(--ink);color:#fff;font-weight:800;font-size:11.5px;white-space:nowrap}
.pt{font-family:Fraunces,Georgia,serif;font-size:17px;line-height:1.68;margin:0}
.rchip{border:0;border-radius:99px;padding:5px 11px;font-size:10.5px;font-weight:800;background:#E8F3EC;color:#1d5b35}
.rchip.sel{background:#2E7D32;color:#fff}
.u{border-bottom:3px solid;padding-bottom:1px;transition:background .3s}
.pt.fading .u,.vt.fading .u{background:transparent!important;border-bottom-color:transparent!important;transition:background 1.8s ease,border-bottom-color 1.8s ease}
#globalBook{position:absolute!important;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
#globalBookGrid{margin:4px 0 8px;padding:8px 10px 10px;background:var(--card,#fff);border:1px solid var(--line,#e6e3dc);border-radius:14px}
#globalBookGrid .gtitle{font:800 10.5px system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:6px 0 4px}
#globalBookGrid .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
#globalBookGrid .grid button,#globalBookGrid .all{font:800 12.5px system-ui;padding:9px 4px;border-radius:10px;border:1px solid var(--line,#e6e3dc);background:var(--card2,#f4f2ee);color:var(--ink,#222);box-shadow:0 1px 0 rgba(0,0,0,.05)}
#globalBookGrid .grid button.on,#globalBookGrid .all.on{background:var(--accent,#1e3a8a);color:#fff;border-color:transparent}
#globalBookGrid .all{display:block;width:100%;margin-bottom:6px}
.vs-pt{font-family:Georgia,serif;font-size:15px;line-height:1.5;margin:6px 0 0;color:var(--ink);user-select:text}
.vs-pt.loading{color:var(--mut);font-style:italic}
.u.c0{border-color:var(--c0);background:rgba(15,123,63,.10)}.u.c1{border-color:var(--c1);background:rgba(30,91,255,.09)}.u.c2{border-color:var(--c2);background:rgba(179,92,0,.10)}.u.c3{border-color:var(--c3);background:rgba(176,0,32,.09)}
.list .it{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
.list .it b{font-size:11px;color:#8A6A3A;min-width:74px}
.find{width:100%;height:44px;border-radius:99px;border:1px solid var(--line);background:#fff;padding:0 16px;font-size:14.5px;outline:0;margin-bottom:12px}
.hint{background:var(--ink);color:#fff;border-radius:20px;padding:16px 18px;font-size:12.5px;line-height:1.6;margin-bottom:14px}
.hint b{color:#FFE08A}
/* feuilles du bas */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:920px;margin:0 auto;max-height:78vh;background:#fff;border-radius:22px 22px 0 0;z-index:40;transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.15)}
.sheet.on{transform:none}
.grab{width:40px;height:6px;border-radius:9px;background:#E0D6C8;margin:10px auto 6px;flex:none}
.shd{padding:4px 20px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex:none;border-bottom:1px solid #F0EAE2}
.shd h3{margin:0;font-size:15px;font-weight:800}
.shd .sub{font-size:12px;color:var(--mut);margin-top:3px}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);font-size:14px;flex:none}
.sbody{overflow-y:auto;padding:12px 16px 26px;flex:1}
.fil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.f{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 10px;font-size:11.5px;font-weight:800;color:#5c5650}
.f.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.li{background:#F9F6F1;border:1px solid #EEE6DB;border-radius:14px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.li:hover{border-color:var(--navy)}
.li .t1{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800}
.yr{font-size:10px;background:var(--ink);color:#fff;padding:2px 8px;border-radius:99px;white-space:nowrap}
.li .t2{font-size:12.5px;font-weight:800;margin-top:3px}
.li .t3{font-family:Fraunces,Georgia,serif;font-size:13.5px;line-height:1.5;margin-top:4px;color:#3a3633}
.li .t3 b{background:#FFF1B8;border-radius:3px}
.k{color:#fff;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:800;margin-right:6px}
.k.c0{background:var(--c0)}.k.c1{background:var(--c1)}.k.c2{background:var(--c2)}.k.c3{background:var(--c3)}
.vitem{border-radius:16px;border:1px solid #EEE6DB;padding:12px 14px;margin-bottom:10px}
.vitem .found{font-family:Fraunces,Georgia,serif;font-size:14px;line-height:1.55;background:#FBF8F3;border-radius:10px;padding:8px 10px;margin:8px 0}
.vitem .found b{background:#FFF1B8;border-radius:3px}
.arrow{font-weight:800;color:var(--blue);font-size:14px;margin:6px 0 4px}
.vbox{background:#EEF2FF;border-radius:12px;padding:10px 12px;font-family:Fraunces,Georgia,serif;font-size:15px;line-height:1.55}
.vacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.vacts button{border:0;border-radius:99px;padding:7px 12px;font-weight:800;font-size:12px;background:var(--ink);color:#fff}
.vacts button.l{background:#EEF2FF;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grid button{height:46px;border:0;border-radius:12px;background:var(--bg);font-weight:800;font-size:13px}
.grid button.on{background:var(--navy);color:#fff}
.grid button.hasl{box-shadow:inset 0 -3px 0 var(--blue)}
.gtitle{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.45;margin:6px 2px 8px}
/* tiroir */
.drawer{position:fixed;left:0;top:0;bottom:0;width:86%;max-width:350px;background:#fff;z-index:40;transform:translateX(-105%);transition:transform .32s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;border-radius:0 20px 20px 0;box-shadow:0 0 40px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.dh{padding:14px 16px;border-bottom:1px solid #F0EAE2;display:flex;align-items:center;justify-content:space-between}
.dbody{flex:1;overflow-y:auto;padding:12px}
.dsec{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.45;margin:12px 6px 6px}
.dit{border-radius:14px;padding:10px 12px;margin-bottom:6px;cursor:pointer;background:#F9F6F1;font-size:13px;font-weight:700}
.dit small{display:block;font-weight:500;opacity:.6;font-size:11px;margin-top:2px}
.dit.soon{opacity:.55;cursor:default;background:#fff;border:1px dashed var(--line)}
/* chargement & démo */
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;border-radius:18px;padding:16px 22px;font-weight:700;font-size:14px;z-index:95;display:none}
.cursor{position:fixed;z-index:100;width:26px;height:26px;border-radius:50%;background:rgba(30,91,255,.25);border:2px solid var(--blue);pointer-events:none;transition:all .6s cubic-bezier(.32,.72,0,1);display:none;transform:translate(-50%,-50%)}
.cursor.click{animation:clk .35s}
@keyframes clk{50%{transform:translate(-50%,-50%) scale(.6);background:rgba(30,91,255,.6)}}
.toast{position:fixed;left:50%;top:128px;transform:translateX(-50%) translateY(-20px);opacity:0;background:var(--ink);color:#fff;border-radius:16px;padding:11px 16px;font-size:13px;font-weight:700;z-index:90;transition:all .35s cubic-bezier(.32,.72,0,1);max-width:92vw;width:max-content;text-align:center;line-height:1.45;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 16px 10px}
header .legend{padding:0 16px 10px}
.lg{font-size:11px;font-weight:800;padding:3px 10px 2px;border-radius:99px;background:#fff;border-bottom:3px solid;cursor:default}
.lg.c0,.fam.c0{color:var(--c0);border-color:var(--c0)}.lg.c1,.fam.c1{color:var(--c1);border-color:var(--c1)}.lg.c2,.fam.c2{color:var(--c2);border-color:var(--c2)}.lg.c3,.fam.c3{color:var(--c3);border-color:var(--c3)}
.fam{background:#fff!important;border:1px solid #EEE6DB!important;border-bottom:3px solid!important;text-decoration:none}
.fam.c0{background:#F1F8F3!important}.fam.c1{background:#F1F4FF!important}.fam.c2{background:#FFF6EC!important}.fam.c3{background:#FFF1F3!important}
.fam.c0{border-bottom-color:var(--c0)!important}.fam.c1{border-bottom-color:var(--c1)!important}.fam.c2{border-bottom-color:var(--c2)!important}.fam.c3{border-bottom-color:var(--c3)!important}
.rchip.fam.sel{box-shadow:0 0 0 2px currentColor}
.swap{border:0;height:36px;border-radius:99px;background:var(--ink);color:#fff;font-weight:800;font-size:12px;padding:0 12px;white-space:nowrap;flex:none}
@media(max-width:560px){.badge{font-size:9px;letter-spacing:.08em}.grid{grid-template-columns:repeat(5,1fr)}}

/* Devise encadrée entre le bouton Bible et le portrait — s’insère dans la hauteur existante */
.hrow .motto{flex:1;min-width:0;margin:0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px 8px;border:1px solid var(--line,#e8e0d6);border-radius:12px;max-height:44px;background:var(--card,rgba(255,255,255,.6));box-shadow:0 1px 2px rgba(0,0,0,.04);line-height:1.15;overflow:hidden}
.hrow .motto .m1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:600;font-size:10.5px;line-height:1.1;color:var(--ink,#1a1c1e);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
@media(min-width:520px){.hrow .motto .m1{font-size:12.5px}}
.hrow .motto .m2{font:800 9.5px/1.2 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent,#b8860b);margin-top:2px;white-space:nowrap}
@media(max-width:360px){.hrow .motto .m2{font-size:9px;letter-spacing:.08em}}
body[data-dark="1"] .hrow .motto{background:var(--card2,rgba(255,255,255,.06))}
body.reading-only .hrow .motto{display:none}
</style>
<style>

[hidden]{display:none!important}

.book-float,.search-float{border:1px solid #ffffffd9;background:radial-gradient(circle at 28% 20%,#fff 0%,#fffffff0 35%,#eef3f6d9 75%,#d4dfe5e8 100%);box-shadow:inset 0 2px 4px #fff,inset 0 -4px 7px #b3c6d655,0 7px 20px #24364626;backdrop-filter:blur(12px)}
.book-float img{mix-blend-mode:multiply}.search-float{position:fixed;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:85;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;cursor:pointer}

<style id="m4-params-bulles-style">
/* ================= M4 — PLAQUETTES, HISTORIQUE, COULEURS, OUVERTURE ================= */
#m4Wing{position:absolute;right:calc(100% + 10px);top:2px;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:192}
#m4Wing .m4WingBtn{width:52px;height:52px;border-radius:50%;border:1px solid rgba(238,236,230,.6);background:var(--ink,#14213d);color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em;cursor:pointer;box-shadow:0 8px 20px #0a12262e;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;padding:3px;opacity:0;transform:translateY(8px);animation:m4WingIn .3s ease forwards}
#m4Wing .m4WingBtn:nth-child(2){animation-delay:.04s} #m4Wing .m4WingBtn:nth-child(3){animation-delay:.08s} #m4Wing .m4WingBtn:nth-child(4){animation-delay:.12s}
@keyframes m4WingIn{to{opacity:1;transform:translateY(0)}}
/* plaquette : petite, AU CENTRE, avec un petit OK qui valide et ferme */
#m4Tray{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:238px;width:calc(100vw - 56px);background:#fffdf8;border-radius:18px;box-shadow:0 22px 60px #14213d3d,0 0 0 1px var(--line,#e7e1d5);padding:12px;z-index:212;text-align:center}
#m4Tray .m4-tray-label{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#6c6459);margin:2px 0 8px}
#m4Tray .m4-modes{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
#m4Tray .m4TrayBtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line,#e7e1d5);background:var(--wash,#f1ece1);font-size:10px;font-weight:800;letter-spacing:.02em;cursor:pointer;line-height:1.05;padding:2px}
#m4Tray .m4TrayBtn.on{background:var(--ink,#14213d);color:#fff}
#m4Tray .m4-ok{width:100%;height:30px;border-radius:99px;border:0;background:var(--ink,#14213d);color:#fff;font-size:12px;font-weight:800;cursor:pointer;letter-spacing:.04em}
